<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GatiFila — Sopa de Gatitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF3E4;
    --surface: #FFFFFF;
    --text: #3A2740;
    --text-soft: #7A6B80;
    --accent: #FF6F91;
    --accent-dark: #E85878;
    --ok: #6BCB77;
    --bad: #EF476F;
    --line: #F0DCC0;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    overscroll-behavior: none;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100dvh;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    touch-action: pan-y;
  }
  .wrap{
    width:100%;
    max-width: 440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
  }
  header{
    width:100%;
    text-align:center;
    margin-bottom: 10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(26px, 7vw, 34px);
    margin: 4px 0 2px;
    letter-spacing: 0.2px;
  }
  h1 span{ color: var(--accent); }
  .sub{
    font-size: 13.5px;
    color: var(--text-soft);
    margin: 0 0 12px;
    line-height:1.4;
  }
  .hud{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 12px;
  }
  .stat{
    background: var(--surface);
    border-radius: 14px;
    padding: 8px 14px;
    flex:1;
    text-align:center;
    box-shadow: 0 2px 0 var(--line);
  }
  .stat .label{
    font-size: 10.5px;
    color: var(--text-soft);
    font-weight:700;
    margin-bottom: 1px;
  }
  .stat .value{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 20px;
    color: var(--text);
  }
  .timebar-outer{
    width:100%;
    height:10px;
    background: var(--surface);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 14px;
    box-shadow: 0 2px 0 var(--line);
  }
  .timebar-inner{
    height:100%;
    width:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    border-radius: 999px;
    transition: width 1s linear, background 0.3s ease;
  }
  .board{
    --cols: 6;
    width:100%;
    aspect-ratio: 6 / 8;
    display:grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: 6px;
    touch-action: none;
    user-select:none;
    position:relative;
  }
  .cell{
    position:relative;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--surface);
    box-shadow: 0 2px 0 var(--line);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .cell .cat{
    width: 84%;
    height: 84%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.15s ease;
  }
  .cell .cat svg{
    width: 100%;
    height: 100%;
    display:block;
  }
  .cell.sel-ok{ transform: scale(0.94); box-shadow: 0 0 0 3px var(--ok) inset, 0 2px 0 var(--line); }
  .cell.sel-bad{ transform: scale(0.94); box-shadow: 0 0 0 3px var(--bad) inset, 0 2px 0 var(--line); }
  .cell.pop .cat{ animation: pop 0.32s ease forwards; }
  @keyframes pop{
    0%{ transform: scale(1); opacity:1; }
    60%{ transform: scale(1.25); opacity:0.7; }
    100%{ transform: scale(0.2); opacity:0; }
  }
  .cell .cat.enter{ animation: drop 0.28s ease; }
  @keyframes drop{
    0%{ transform: translateY(-140%); opacity:0; }
    100%{ transform: translateY(0); opacity:1; }
  }
  footer{
    margin-top: 14px;
    text-align:center;
    color: var(--text-soft);
    font-size: 12px;
    line-height:1.5;
  }
  .overlay{
    position:fixed; inset:0;
    background: rgba(58,39,64,0.55);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.hidden{ display:none; }
  .card{
    background: var(--surface);
    border-radius: 20px;
    padding: 28px 24px;
    text-align:center;
    max-width: 340px;
    width:100%;
  }
  .card h2{
    font-family:'Baloo 2', sans-serif;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .card p{
    color: var(--text-soft);
    margin: 0 0 4px;
    font-size: 14px;
  }
  .card .final-score{
    font-family:'Baloo 2', sans-serif;
    font-size: 42px;
    color: var(--accent);
    margin: 10px 0;
  }
  .btn{
    margin-top: 14px;
    background: var(--accent);
    color: white;
    border: none;
    font-family:'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    padding: 13px 22px;
    border-radius: 999px;
    width:100%;
    cursor:pointer;
  }
  .btn:active{ background: var(--accent-dark); }
  .toast{
    position:fixed;
    left:50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--text);
    color: #FFF6EC;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 20;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .stat.time-bonus{ animation: timePulse 0.5s ease; }
  @keyframes timePulse{
    0%{ background: var(--surface); }
    35%{ background: #DFF5E1; }
    100%{ background: var(--surface); }
  }
  .stat .bonus-flag{
    display:inline-block;
    color: var(--ok);
    font-size: 11px;
    font-weight:800;
    margin-left: 4px;
    opacity: 0;
    transform: translateY(0);
  }
  .stat.time-bonus .bonus-flag{
    animation: bonusFloat 0.7s ease forwards;
  }
  @keyframes bonusFloat{
    0%{ opacity: 1; transform: translateY(0); }
    100%{ opacity: 0; transform: translateY(-10px); }
  }
  .links-row{
    display:flex;
    gap: 14px;
    justify-content:center;
    margin: 2px 0 12px;
  }
  .link-btn{
    background:none;
    border:none;
    color: var(--text-soft);
    font-family:'Nunito', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor:pointer;
    padding: 2px 0;
  }
  .mode-options{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 16px;
    text-align:left;
  }
  .mode-btn{
    display:block;
    width:100%;
    background: var(--bg);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    text-align:left;
    cursor:pointer;
    font-family:'Nunito', sans-serif;
    transition: transform 0.12s ease;
  }
  .mode-btn:active{ transform: scale(0.97); }
  .mode-btn .mode-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 17px;
    color: var(--text);
    margin-bottom: 2px;
  }
  .mode-btn .mode-desc{
    font-size: 12.5px;
    color: var(--text-soft);
    line-height:1.4;
  }
  .mode-btn.zen{
    background: #F1FBF3;
    border-color: #BFE3C6;
  }
  .mode-btn.zen .mode-title{ color: #3E8E52; }
  .zen-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background: #F1FBF3;
    border: 1px solid #BFE3C6;
    color: #3E8E52;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 13px;
    border-radius: 12px;
    padding: 6px 4px;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Gati<span>Fila</span></h1>
      <p class="sub" id="subText">Arrastrá en línea recta para juntar 3 o más gatitos del mismo tipo.</p>
      <div class="links-row">
        <button class="link-btn" id="inlineRestartBtn">Reiniciar</button>
        <button class="link-btn" id="modeSwitchBtn">Cambiar modo</button>
      </div>
    </header>

    <div class="hud">
      <div class="stat">
        <div class="label">PUNTOS</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="label">MEJOR</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="stat" id="timeStat">
        <div class="label">TIEMPO</div>
        <div class="value"><span id="time">90</span><span class="bonus-flag" id="bonusFlag">+1s</span></div>
      </div>
    </div>

    <div class="timebar-outer"><div class="timebar-inner" id="timebar"></div></div>

    <div class="board" id="board"></div>

    <footer>Líneas horizontales, verticales o en diagonal.</footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="modeSelect">
    <div class="card">
      <h2>Gati<span style="color:var(--accent)">Fila</span></h2>
      <p>Elegí cómo querés jugar</p>
      <div class="mode-options">
        <button class="mode-btn" data-mode="classic">
          <div class="mode-title">⏱️ Clásico</div>
          <div class="mode-desc">90 segundos, sumás +1s por cada fila y competís por tu mejor puntaje.</div>
        </button>
        <button class="mode-btn zen" data-mode="zen">
          <div class="mode-title">🌿 AntiAnsiedad</div>
          <div class="mode-desc">Sin cronómetro ni presión. Jugá a tu ritmo, sin apuro.</div>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <h2 id="overlayTitle">¡Se acabó el tiempo!</h2>
      <p>Puntaje final</p>
      <div class="final-score" id="finalScore">0</div>
      <p id="overlayMsg"></p>
      <button class="btn" id="restartBtn">Jugar de nuevo</button>
      <button class="link-btn" id="overlayModeSwitchBtn" style="margin-top:10px;">Cambiar modo</button>
    </div>
  </div>

<script>
(function(){
  const COLS = 6, ROWS = 8;
  const GAME_SECONDS = 90;
  const TYPES = [
    { id:0, name:'Atigrado', base:'#E8A55C', tint:'#FCE7CF', earInner:'#F6C9A0', eye:'#3A2740', nose:'#B4718A', line:'#5B4A63', whisker:'#8A5A2E', pattern:'stripes', accent:'#B96F2E' },
    { id:1, name:'Negro',    base:'#4A4458', tint:'#E4DFE8', earInner:'#6E5C77', eye:'#BFF4C0', nose:'#D68FA6', line:'#E4DFE8', whisker:'#E4DFE8', pattern:'solid',   accent:'#3A3446' },
    { id:2, name:'Blanco',   base:'#FDF6EC', tint:'#F5E9D6', earInner:'#F2C6D6', eye:'#3A2740', nose:'#E28FA6', line:'#5B4A63', whisker:'#C9B79A', pattern:'outline', accent:'#E0CBAA' },
    { id:3, name:'Gris',     base:'#9AA3B2', tint:'#E9EDF2', earInner:'#F2A6C1', eye:'#2C2A33', nose:'#B4718A', line:'#3A3A42', whisker:'#F3F5F8', pattern:'solid',   accent:'#7B8494' },
    { id:4, name:'Naranja',  base:'#FF9F5A', tint:'#FFE6D2', earInner:'#FFD3AE', eye:'#3A2740', nose:'#B4718A', line:'#5B4A63', whisker:'#C9631E', pattern:'patch',   accent:'#FFF6EC' },
    { id:5, name:'Manchado', base:'#F2A6C1', tint:'#FDEAF1', earInner:'#F7C6DA', eye:'#3A2740', nose:'#B4718A', line:'#5B4A63', whisker:'#C9789A', pattern:'spots',   accent:'#A9673D' },
  ];

  function catSVG(t){
    const earL = `<path d="M22,34 L33,9 L43,37 Z" fill="${t.base}"/>`;
    const earR = `<path d="M78,34 L67,9 L57,37 Z" fill="${t.base}"/>`;
    const earLInner = `<path d="M27,30 L33,17 L38,32 Z" fill="${t.earInner}"/>`;
    const earRInner = `<path d="M73,30 L67,17 L62,32 Z" fill="${t.earInner}"/>`;
    const headOutline = t.pattern === 'outline' ? `stroke="${t.accent}" stroke-width="2"` : '';
    const head = `<circle cx="50" cy="56" r="34" fill="${t.base}" ${headOutline}/>`;

    let pattern = '';
    if(t.pattern === 'stripes'){
      pattern = `<g stroke="${t.accent}" stroke-width="3" stroke-linecap="round">
        <path d="M32,28 L38,20" fill="none"/>
        <path d="M42,24 L46,15" fill="none"/>
        <path d="M68,28 L62,20" fill="none"/>
        <path d="M58,24 L54,15" fill="none"/>
        <path d="M20,50 L28,49" fill="none"/>
        <path d="M80,50 L72,49" fill="none"/>
      </g>`;
    } else if(t.pattern === 'spots'){
      pattern = `<g fill="${t.accent}">
        <circle cx="30" cy="44" r="5"/>
        <circle cx="67" cy="62" r="6"/>
        <circle cx="62" cy="32" r="3.5"/>
        <circle cx="36" cy="70" r="4"/>
      </g>`;
    } else if(t.pattern === 'patch'){
      pattern = `<ellipse cx="50" cy="76" rx="16" ry="11" fill="${t.accent}"/>`;
    }

    const eyes = `<g>
      <ellipse cx="38" cy="53" rx="4.6" ry="6.2" fill="${t.eye}"/>
      <ellipse cx="62" cy="53" rx="4.6" ry="6.2" fill="${t.eye}"/>
      <circle cx="39.4" cy="50.4" r="1.4" fill="#fff"/>
      <circle cx="63.4" cy="50.4" r="1.4" fill="#fff"/>
    </g>`;
    const nose = `<path d="M46.5,63 L53.5,63 L50,67.5 Z" fill="${t.nose}"/>`;
    const mouth = `<path d="M50,67.5 Q45,73 39,69.5 M50,67.5 Q55,73 61,69.5" stroke="${t.line}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    const whiskers = `<g stroke="${t.whisker}" stroke-width="1.5" stroke-linecap="round">
      <line x1="10" y1="56" x2="28" y2="54"/>
      <line x1="10" y1="63" x2="28" y2="61.5"/>
      <line x1="90" y1="56" x2="72" y2="54"/>
      <line x1="90" y1="63" x2="72" y2="61.5"/>
    </g>`;

    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="56" r="46" fill="${t.tint}"/>
      ${earL}${earR}${earLInner}${earRInner}
      ${head}
      ${pattern}
      ${eyes}${nose}${mouth}${whiskers}
    </svg>`;
  }

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const timeEl = document.getElementById('time');
  const timebarEl = document.getElementById('timebar');
  const overlayEl = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const overlayTitleEl = document.getElementById('overlayTitle');
  const overlayMsgEl = document.getElementById('overlayMsg');
  const restartBtn = document.getElementById('restartBtn');
  const toastEl = document.getElementById('toast');
  const timeStatEl = document.getElementById('timeStat');
  const bonusFlagEl = document.getElementById('bonusFlag');
  const TIME_BONUS = 1;
  const modeSelectEl = document.getElementById('modeSelect');
  const modeButtons = document.querySelectorAll('.mode-btn');
  const inlineRestartBtn = document.getElementById('inlineRestartBtn');
  const modeSwitchBtn = document.getElementById('modeSwitchBtn');
  const overlayModeSwitchBtn = document.getElementById('overlayModeSwitchBtn');
  const subTextEl = document.getElementById('subText');
  const timebarOuterEl = document.querySelector('.timebar-outer');
  let currentMode = 'classic';

  const MODE_COPY = {
    classic: 'Arrastrá en línea recta para juntar 3 o más gatitos del mismo tipo.',
    zen: 'Sin cronómetro. Arrastrá en línea recta y jugá a tu propio ritmo 🌿',
  };

  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  boardEl.style.setProperty('--cols', COLS);

  let grid = [];
  let cellEls = [];
  let score = 0, best = 0, timeLeft = GAME_SECONDS;
  let timerId = null, running = false;
  let dragging = false, startCell = null, currentPath = [];

  function randType(){ return Math.floor(Math.random()*TYPES.length); }

  function boardHasMove(g){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const type = g[r][c];
        if(type === null) continue;
        for(const [dr,dc] of dirs){
          const r2=r+dr, c2=c+dc, r3=r+2*dr, c3=c+2*dc;
          if(r3<0||r3>=ROWS||c3<0||c3>=COLS) continue;
          if(g[r2][c2] === type && g[r3][c3] === type) return true;
        }
      }
    }
    return false;
  }

  function randomGrid(){
    const g = [];
    for(let r=0;r<ROWS;r++){
      const row = [];
      for(let c=0;c<COLS;c++) row.push(randType());
      g.push(row);
    }
    return g;
  }

  function buildGridData(){
    let g = randomGrid();
    let attempts = 0;
    while(!boardHasMove(g) && attempts < 200){
      g = randomGrid();
      attempts++;
    }
    grid = g;
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    cellEls = [];
    for(let r=0;r<ROWS;r++){
      const rowEls = [];
      for(let c=0;c<COLS;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        const cat = document.createElement('div');
        cat.className = 'cat';
        applyCatStyle(cat, grid[r][c]);
        cell.appendChild(cat);
        boardEl.appendChild(cell);
        rowEls.push(cell);
      }
      cellEls.push(rowEls);
    }
  }

  function applyCatStyle(catEl, typeId){
    catEl.innerHTML = catSVG(TYPES[typeId]);
    catEl.dataset.type = typeId;
  }

  function cellFromPoint(x, y){
    const el = document.elementFromPoint(x, y);
    if(!el) return null;
    const cellEl = el.closest('.cell');
    if(!cellEl || !boardEl.contains(cellEl)) return null;
    return { row: +cellEl.dataset.row, col: +cellEl.dataset.col };
  }

  function getLine(start, end){
    const dr = end.row - start.row, dc = end.col - start.col;
    if(dr === 0 && dc === 0) return [start];
    if(dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return null;
    const steps = Math.max(Math.abs(dr), Math.abs(dc));
    const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
    const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
    const path = [];
    for(let i=0;i<=steps;i++){
      path.push({ row: start.row + stepR*i, col: start.col + stepC*i });
    }
    return path;
  }

  function clearHighlight(){
    for(const p of currentPath){
      const el = cellEls[p.row][p.col];
      el.classList.remove('sel-ok','sel-bad');
    }
    currentPath = [];
  }

  function applyHighlight(path){
    const startType = grid[path[0].row][path[0].col];
    const allSame = path.every(p => grid[p.row][p.col] === startType);
    for(const p of path){
      const el = cellEls[p.row][p.col];
      el.classList.add(allSame ? 'sel-ok' : 'sel-bad');
    }
    return allSame;
  }

  function onDown(x, y){
    if(!running) return;
    const c = cellFromPoint(x, y);
    if(!c) return;
    dragging = true;
    startCell = c;
    clearHighlight();
    currentPath = [c];
    applyHighlight(currentPath);
  }

  function onMove(x, y){
    if(!dragging) return;
    const c = cellFromPoint(x, y);
    if(!c) return;
    const line = getLine(startCell, c);
    if(!line) return;
    clearHighlight();
    currentPath = line;
    applyHighlight(currentPath);
  }

  function onUp(){
    if(!dragging) return;
    dragging = false;
    const path = currentPath;
    const startType = grid[path[0].row][path[0].col];
    const allSame = path.every(p => grid[p.row][p.col] === startType);
    clearHighlight();
    if(allSame && path.length >= 3){
      resolveMatch(path);
    }
  }

  function addTimeBonus(seconds){
    timeLeft += seconds;
    timeEl.textContent = Math.max(timeLeft, 0);
    timebarEl.style.width = Math.min(100, Math.max(timeLeft,0) / GAME_SECONDS * 100) + '%';
    if(timeLeft > 15){
      timebarEl.style.background = 'linear-gradient(90deg, var(--accent), var(--accent-dark))';
    }
    timeStatEl.classList.remove('time-bonus');
    void timeStatEl.offsetWidth;
    bonusFlagEl.textContent = '+' + seconds + 's';
    timeStatEl.classList.add('time-bonus');
  }

  function resolveMatch(path){
    const pts = path.length * 10 + (path.length >= 5 ? 20 : 0);
    score += pts;
    scoreEl.textContent = score;
    if(score > best){ best = score; bestEl.textContent = best; }
    if(currentMode === 'classic'){ addTimeBonus(TIME_BONUS); }

    const cols = new Set();
    for(const p of path){
      cols.add(p.col);
      grid[p.row][p.col] = null;
      const el = cellEls[p.row][p.col];
      el.classList.add('pop');
    }

    setTimeout(() => {
      for(const col of cols) collapseColumn(col);
      if(running && !boardHasMove(grid)){
        setTimeout(reshuffleBoard, 320);
      }
    }, 260);
  }

  function reshuffleBoard(){
    buildGridData();
    renderBoard();
    showToast('Sin jugadas posibles — ¡grilla nueva!');
  }

  function collapseColumn(col){
    const stack = [];
    for(let r=ROWS-1;r>=0;r--){
      if(grid[r][col] !== null) stack.push(grid[r][col]);
    }
    const newCol = new Array(ROWS).fill(null);
    for(let i=0;i<stack.length;i++){
      newCol[ROWS-1-i] = stack[i];
    }
    for(let r=ROWS-1;r>=0;r--){
      if(newCol[r] === null) newCol[r] = randType();
    }
    for(let r=0;r<ROWS;r++){
      grid[r][col] = newCol[r];
      const cell = cellEls[r][col];
      const oldCat = cell.querySelector('.cat');
      const cat = document.createElement('div');
      cat.className = 'cat enter';
      applyCatStyle(cat, newCol[r]);
      cell.replaceChild(cat, oldCat);
      cell.classList.remove('pop');
    }
  }

  boardEl.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
  window.addEventListener('pointermove', e => { if(dragging){ e.preventDefault(); onMove(e.clientX, e.clientY); } }, { passive:false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  function tick(){
    timeLeft -= 1;
    timeEl.textContent = Math.max(timeLeft,0);
    timebarEl.style.width = Math.min(100, Math.max(timeLeft,0) / GAME_SECONDS * 100) + '%';
    if(timeLeft <= 15){ timebarEl.style.background = 'linear-gradient(90deg, var(--bad), var(--accent-dark))'; }
    if(timeLeft <= 0){ endGame(); }
  }

  function startGame(mode){
    currentMode = mode;
    subTextEl.textContent = MODE_COPY[mode];
    score = 0;
    scoreEl.textContent = '0';
    bestEl.textContent = best;
    buildGridData();
    renderBoard();
    overlayEl.classList.add('hidden');
    modeSelectEl.classList.add('hidden');
    running = true;
    clearInterval(timerId);
    timerId = null;

    if(mode === 'classic'){
      timeStatEl.style.display = '';
      timebarOuterEl.style.display = '';
      timeLeft = GAME_SECONDS;
      timeEl.textContent = GAME_SECONDS;
      timebarEl.style.width = '100%';
      timebarEl.style.background = 'linear-gradient(90deg, var(--accent), var(--accent-dark))';
      timerId = setInterval(tick, 1000);
    } else {
      timeStatEl.style.display = 'none';
      timebarOuterEl.style.display = 'none';
    }
  }

  function endGame(){
    running = false;
    clearInterval(timerId);
    finalScoreEl.textContent = score;
    overlayTitleEl.textContent = '¡Se acabó el tiempo!';
    overlayMsgEl.textContent = score >= best && score > 0 ? '¡Nuevo mejor puntaje!' : '';
    overlayEl.classList.remove('hidden');
  }

  function backToModeSelect(){
    running = false;
    clearInterval(timerId);
    overlayEl.classList.add('hidden');
    modeSelectEl.classList.remove('hidden');
  }

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => startGame(btn.dataset.mode));
  });
  inlineRestartBtn.addEventListener('click', () => startGame(currentMode));
  modeSwitchBtn.addEventListener('click', backToModeSelect);
  overlayModeSwitchBtn.addEventListener('click', backToModeSelect);
  restartBtn.addEventListener('click', () => startGame(currentMode));
})();
</script>
</body>
</html>
