<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GatiFila — Sopa de Gatitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Gati<span>Fila</span></h1>
      <p class="sub" id="subText">Arrastrá en línea recta para juntar 3 o más gatitos del mismo tipo.</p>
      <div class="links-row">
        <button class="link-btn" id="inlineRestartBtn">Reiniciar</button>
        <button class="link-btn" id="modeSwitchBtn">Cambiar modo</button>
        <button class="link-btn" id="muteBtn">🔊 Música</button>
      </div>
    </header>

    <div class="hud">
      <div class="stat">
        <div class="label">PUNTOS</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="label">MEJOR</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="stat" id="timeStat">
        <div class="label">TIEMPO</div>
        <div class="value"><span id="time">90</span><span class="bonus-flag" id="bonusFlag">+1s</span></div>
      </div>
    </div>

    <div class="timebar-outer"><div class="timebar-inner" id="timebar"></div></div>

    <div class="board" id="board"></div>

    <footer>Líneas horizontales, verticales o en diagonal. Los comodines ✦ completan cualquier fila.</footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="modeSelect">
    <div class="card">
      <h2>Gati<span style="color:var(--accent)">Fila</span></h2>
      <p>Elegí cómo querés jugar</p>
      <div class="mode-options">
        <button class="mode-btn" data-mode="classic">
          <div class="mode-title">⏱️ Clásico</div>
          <div class="mode-desc">90 segundos, sumás +1s por cada fila y competís por tu mejor puntaje.</div>
        </button>
        <button class="mode-btn zen" data-mode="zen">
          <div class="mode-title">🌿 AntiAnsiedad</div>
          <div class="mode-desc">Sin cronómetro ni presión. Jugá a tu ritmo, sin apuro.</div>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <h2 id="overlayTitle">¡Se acabó el tiempo!</h2>
      <p>Puntaje final</p>
      <div class="final-score" id="finalScore">0</div>
      <p id="overlayMsg"></p>
      <button class="btn" id="restartBtn">Jugar de nuevo</button>
      <button class="link-btn" id="overlayModeSwitchBtn" style="margin-top:10px;">Cambiar modo</button>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
